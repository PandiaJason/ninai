name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: win
            arch: x64
          - label: Linux x64
            os: ubuntu-latest
            target: linux
            arch: x64
          - label: macOS x64
            os: macos-15-intel
            target: mac
            arch: x64
          - label: macOS arm64
            os: macos-latest
            target: mac
            arch: arm64

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package desktop app
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ninai-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/latest*.yml
